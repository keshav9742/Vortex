<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRACE Admin</title>
    <style>
      :root { font-family: Arial, sans-serif; color: #172033; background: #f4f6fa; }
      body { margin: 0; }
      header { background: #172033; color: white; padding: 20px 32px; }
      nav { display: flex; gap: 18px; margin-top: 12px; }
      nav a { color: #b9c7e6; text-decoration: none; }
      nav a:hover { color: white; }
      main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
      .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 24px; }
      .card { background: white; border: 1px solid #dfe4ee; border-radius: 10px; padding: 20px; }
      .card strong { display: block; font-size: 28px; margin-top: 8px; }
      table { width: 100%; background: white; border-collapse: collapse; margin-top: 28px; border: 1px solid #dfe4ee; }
      th, td { text-align: left; padding: 14px 16px; border-bottom: 1px solid #edf0f5; }
      th { background: #eef2f8; }
      @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <h1>TRACE Admin</h1>
      <p>Manage platform integrations and privacy insights.</p>
      <nav>
        <a href="user page.html">User page</a>
        <a href="admin page.html">Admin page</a>
      </nav>
    </header>

    <main>
      <h2>Dashboard overview</h2>
      <section class="cards" aria-label="Dashboard statistics">
        <article class="card"><span>Registered users</span><strong>0</strong></article>
        <article class="card"><span>Connected platforms</span><strong>0</strong></article>
        <article class="card"><span>Reports generated</span><strong>0</strong></article>
      </section>

      <table>
        <thead>
          <tr><th>Platform</th><th>Status</th><th>Last sync</th></tr>
        </thead>
        <tbody>
          <tr><td>Google Takeout</td><td>Not connected</td><td>—</td></tr>
          <tr><td>Instagram</td><td>Not connected</td><td>—</td></tr>
          <tr><td>Spotify</td><td>Not connected</td><td>—</td></tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
